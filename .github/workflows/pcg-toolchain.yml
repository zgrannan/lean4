name: PCG toolchain

# Builds the Lean toolchain used by the `pcg-docs` CI and publishes it as a workflow artifact.
# `pcg-docs` pins the commit of this branch in `formalization/pcg-lean-rev` and downloads the
# artifact of the run that built that commit (see `scripts/fetch_pcg_lean.py` there).

on:
  push:
    branches:
      - pcg-optimized
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: ubuntu-24.04-arm
            # inline LSE atomics; every aarch64 CPU of the last years has them
            march: -march=armv8.2-a
          - arch: x86_64
            os: ubuntu-24.04
            march: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      TOOLCHAIN: lean-pcg-linux_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache libgmp-dev libuv1-dev libssl-dev pkgconf

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.arch }}-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DSTRIP_BINARIES=ON -DWFAIL=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DLEAN_STANDALONE=ON \
            "-DLEAN_EXTRA_LINKER_FLAGS=-Wl,--as-needed -lgmp -luv -lssl -lcrypto -lpthread -ldl -lrt -Wl,--no-as-needed" \
            -DLEAN_EXTRA_CXX_FLAGS="${{ matrix.march }}" -DLEANC_EXTRA_CC_FLAGS="${{ matrix.march }}"

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Install
        run: |
          cmake --install build/stage1 --prefix "$PWD/dist/$TOOLCHAIN"
          # `leanc` links executables with `-lgmp -lssl -lcrypto -luv` (see `--print-ldflags`) and
          # looks in the toolchain first, so the machines that use it need no development packages;
          # `libleanshared.so` needs libuv at run time
          libdir=/usr/lib/${{ matrix.arch }}-linux-gnu
          cp -L "$libdir/libuv.so.1" "dist/$TOOLCHAIN/lib/lean/"
          cp "$libdir"/{libuv,libgmp,libssl,libcrypto}.a "dist/$TOOLCHAIN/lib/lean/"

      - name: Smoke test
        run: |
          export PATH="$PWD/dist/$TOOLCHAIN/bin:$PATH"
          lean --version
          lake --version
          printf 'def x : Nat := 1\n#eval x + 1\ntheorem t : x = 1 := rfl\n' > /tmp/smoke.lean
          lean /tmp/smoke.lean
          # no flag may name a library of this machine
          if leanc --print-ldflags | tr ' ' '\n' | grep '^/usr/'; then exit 1; fi
          printf 'def main : IO Unit := IO.println s!"{(2 : Nat) ^ 100}"\n' > /tmp/Main.lean
          lean /tmp/Main.lean -c /tmp/main.c
          leanc /tmp/main.c -o /tmp/hello
          /tmp/hello

      - name: Package
        # a plain tar: the artifact upload compresses it, and the consumer needs nothing but Python
        run: tar -C dist -cf "$TOOLCHAIN.tar" "$TOOLCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: pcg-lean-linux_${{ matrix.arch }}
          path: ${{ env.TOOLCHAIN }}.tar
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
