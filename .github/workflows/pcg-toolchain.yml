name: PCG toolchain

# Builds PCG Lean toolchains and publishes them as workflow artifacts.
# `pcg-docs` selects a commit in `formalization/pcg-lean-rev` and downloads the
# artifact of the run that built that commit (see `scripts/fetch_pcg_lean.py` there).
#
# The compiler is built with GCC profile-guided optimization when `script/pgo/profile-<arch>.tar.xz`
# exists. A dispatch with `pgo: instrument` builds the instrumented compiler instead; the profile
# is recorded by running it over the project (the `Lean PGO profile` workflow of `pcg-docs`) and
# committed with `script/pgo/profile-rev` naming the commit that was instrumented.

on:
  push:
    branches:
      - pcg-optimized
      - pcg-optimized-4.36-rc1
  workflow_dispatch:
    inputs:
      pgo:
        description: "instrument: GCC PGO instrumentation; bolt-instrument: BOLT instrumentation on PGO build"
        type: choice
        options: [auto, instrument, bolt-instrument]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pgo }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: ubuntu-24.04-arm
            # inline LSE atomics; every aarch64 CPU of the last years has them
            march: -march=armv8.2-a
          - arch: x86_64
            os: ubuntu-24.04
            march: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      TOOLCHAIN: lean-pcg-linux_${{ matrix.arch }}
      # the profile names the object files by their absolute path, which must be the same in the
      # instrumented and the profile-guided build
      GCDA: ${{ github.workspace }}/pgo-gcda
      BOLT_FDATA_DIR: /tmp/bolt-fdata
    steps:
      - uses: actions/checkout@v4

      - name: Select the optimization mode
        run: |
          profile=script/pgo/profile-${{ matrix.arch }}.tar.xz
          bolt_profile=script/pgo/bolt-${{ matrix.arch }}.fdata.xz
          if [ "${{ inputs.pgo }}" = instrument ]; then
            echo "PGO_MODE=instrument" >> "$GITHUB_ENV"
            echo "BOLT_MODE=none" >> "$GITHUB_ENV"
          elif [ "${{ inputs.pgo }}" = bolt-instrument ]; then
            echo "PGO_MODE=use" >> "$GITHUB_ENV"
            echo "BOLT_MODE=instrument" >> "$GITHUB_ENV"
          elif [ -f "$profile" ]; then
            echo "PGO_MODE=use" >> "$GITHUB_ENV"
            if [ -f "$bolt_profile" ]; then
              echo "BOLT_MODE=use" >> "$GITHUB_ENV"
            else
              echo "BOLT_MODE=none" >> "$GITHUB_ENV"
            fi
          else
            echo "PGO_MODE=plain" >> "$GITHUB_ENV"
            echo "BOLT_MODE=none" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache libgmp-dev libuv1-dev libssl-dev pkgconf bolt-19 libbolt-19-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ inputs.pgo }}-${{ hashFiles('script/pgo/profile-*') }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.arch }}-${{ inputs.pgo }}-${{ hashFiles('script/pgo/profile-*') }}-

      - name: Unpack the profile
        if: env.PGO_MODE == 'use'
        run: |
          mkdir -p "$GCDA"
          tar -C "$GCDA" -xJf script/pgo/profile-${{ matrix.arch }}.tar.xz
          # the profile only matches objects that are compiled in the directory it was recorded in
          mangled=${PWD//\//#}#build#
          if ! find "$GCDA" -name '*.gcda' | grep -qF -e "$mangled" -e "$PWD/build/"; then
            echo "::error::the profile was not recorded in $PWD/build"
            exit 1
          fi

      - name: Check that the profile matches the sources
        if: env.PGO_MODE == 'use'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(tr -d '[:space:]' < script/pgo/profile-rev)
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$rev...$GITHUB_SHA" --paginate \
            --jq '.files[].filename' | grep '^src/' || true)
          if [ -n "$changed" ]; then
            echo "::warning::sources changed since the profile was recorded at $rev; record it again: $(echo $changed | head -c 400)"
          fi

      - name: Configure
        run: |
          source script/pcg_pgo_flags.sh
          ldflags="-Wl,--emit-relocs -Wl,--as-needed -lgmp -luv -lssl -lcrypto -lpthread -ldl -lrt -Wl,--no-as-needed"
          case "$PGO_MODE" in
            instrument) flags=$(pgo_flags generate "$GCDA" "${{ matrix.march }}")
                        ldflags="$ldflags -fprofile-generate" ;;
            use)        flags=$(pgo_flags use "$GCDA" "${{ matrix.march }}") ;;
            plain)      flags="-fno-reorder-blocks-and-partition ${{ matrix.march }}" ;;
          esac
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DSTRIP_BINARIES=OFF -DWFAIL=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCADICAL_EXTRA_CXX_FLAGS="-fno-reorder-blocks-and-partition" \
            -DLEAN_STANDALONE=ON \
            "-DLEAN_EXTRA_LINKER_FLAGS=$ldflags" \
            "-DLEAN_EXTRA_CXX_FLAGS=$flags" "-DLEANC_EXTRA_CC_FLAGS=$flags"

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Test elaboration and compilation
        if: env.PGO_MODE != 'instrument' && env.BOLT_MODE != 'instrument'
        run: |
          ctest --test-dir build/stage1 --output-on-failure \
            --parallel "$(nproc)" --no-tests=error \
            -R '^(elab|elab_fail|compile|docparse)/'

      - name: Install
        run: |
          cmake --install build/stage1 --prefix "$PWD/dist/$TOOLCHAIN"
          # `leanc` links executables with `-lgmp -lssl -lcrypto -luv` (see `--print-ldflags`) and
          # looks in the toolchain first, so the machines that use it need no development packages;
          # `libleanshared.so` needs libuv at run time
          libdir=/usr/lib/${{ matrix.arch }}-linux-gnu
          cp -L "$libdir/libuv.so.1" "dist/$TOOLCHAIN/lib/lean/"
          cp "$libdir"/{libuv,libgmp,libssl,libcrypto}.a "dist/$TOOLCHAIN/lib/lean/"

      - name: Apply LLVM BOLT to libleanshared.so
        run: |
          so="dist/$TOOLCHAIN/lib/lean/libleanshared.so"
          bolt=/usr/lib/llvm-19/bin/llvm-bolt
          case "$BOLT_MODE" in
            instrument)
              "$bolt" "$so" -o "$so.bolt" \
                --skip-funcs='^(runtime_initialize_|meta_initialize_|initialize_|.*___regBuiltin_|.*___closed__|.*_initFn_|lean_obj_once|l_Lean_Lsp_|l_Lean_Server_|l_Lean_Widget_|l_Std_Http_|l_Std_Time_).*' \
                --instrument \
                --instrumentation-file="$BOLT_FDATA_DIR/prof.fdata" \
                --instrumentation-file-append-pid
              mv "$so.bolt" "$so"
              ;;
            use)
              xz -dc "script/pgo/bolt-${{ matrix.arch }}.fdata.xz" > "$RUNNER_TEMP/bolt.fdata"
              "$bolt" "$so" -o "$so.bolt" \
                -data="$RUNNER_TEMP/bolt.fdata" \
                -reorder-blocks=ext-tsp \
                -reorder-functions=cdsort \
                -split-functions \
                -split-all-cold \
                -split-eh \
                -icf=1 \
                --infer-stale-profile=1 \
                --remove-symtab \
                -dyno-stats
              mv "$so.bolt" "$so"
              ;;
            none)
              strip --strip-unneeded "$so"
              ;;
          esac

      - name: Smoke test
        run: |
          # an instrumented compiler writes its counters at exit
          export GCOV_PREFIX="$RUNNER_TEMP/smoke-gcda"
          mkdir -p "$BOLT_FDATA_DIR"
          export PATH="$PWD/dist/$TOOLCHAIN/bin:$PATH"
          lean --version
          lake --version
          printf 'def x : Nat := 1\n#eval x + 1\ntheorem t : x = 1 := rfl\n' > /tmp/smoke.lean
          lean /tmp/smoke.lean
          # no flag may name a library of this machine
          if leanc --print-ldflags | tr ' ' '\n' | grep '^/usr/'; then exit 1; fi
          mkdir /tmp/hello && cd /tmp/hello
          printf 'def main : IO Unit := IO.println s!"{(2 : Nat) ^ 100}"\n' > Main.lean
          lean Main.lean -c main.c
          leanc main.c -o hello
          ./hello
          rm -rf "$BOLT_FDATA_DIR"

      - name: Package
        # a plain tar: the artifact upload compresses it, and the consumer needs nothing but Python
        run: tar -C dist -cf "$TOOLCHAIN.tar" "$TOOLCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (env.PGO_MODE == 'instrument' || env.BOLT_MODE == 'instrument') && 'pcg-lean-pgo-instrumented' || 'pcg-lean-linux' }}_${{ matrix.arch }}
          path: ${{ env.TOOLCHAIN }}.tar
          compression-level: 6
          retention-days: ${{ (env.PGO_MODE == 'instrument' || env.BOLT_MODE == 'instrument') && 14 || 90 }}
          if-no-files-found: error
